<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Paste to Markdown</title>
    <meta
      name="description"
      content="The page you requested could not be found. Return to Paste to Markdown or learn more about the project."
    />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#2a1843" />
    <link rel="canonical" href="https://sbolel.github.io/paste-to-markdown/404.html" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #120d1c;
        --bg-accent: rgba(97, 74, 160, 0.32);
        --panel: rgba(19, 17, 28, 0.84);
        --panel-border: rgba(173, 164, 208, 0.18);
        --text: #f5f5f7;
        --muted: #bdb6ce;
        --primary: #ffffff;
        --primary-text: #16111f;
        --secondary: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, var(--bg-accent), transparent 38%),
          linear-gradient(180deg, #211536 0%, var(--bg) 58%, #09070f 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(100%, 720px);
        padding: 32px;
        border: 1px solid var(--panel-border);
        border-radius: 32px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      }

      p {
        margin: 18px 0 0;
        max-width: 42ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      nav {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        transition:
          transform 140ms ease,
          background-color 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      a:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 3px rgba(9, 7, 15, 0.9),
          0 0 0 5px rgba(255, 255, 255, 0.92);
      }

      .primary {
        background: var(--primary);
        color: var(--primary-text);
      }

      .secondary {
        border: 1px solid var(--panel-border);
        background: var(--secondary);
        color: var(--text);
      }

      @media (max-width: 640px) {
        main {
          padding: 24px;
          border-radius: 24px;
        }

        nav {
          flex-direction: column;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Page not found.</h1>
      <p>
        This route does not exist in the GitHub Pages build for Paste to Markdown.
        You can go back to the converter or read more about the project.
      </p>
      <nav aria-label="404 navigation">
        <a class="primary" href="/paste-to-markdown/">Back to the app</a>
        <a class="secondary" href="/paste-to-markdown/about/">About the project</a>
      </nav>
    </main>
  </body>
</html>
