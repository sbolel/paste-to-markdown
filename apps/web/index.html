            "description": "Paste to Markdown converts rich clipboard HTML into clean Markdown locally in the browser.",

            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript and clipboard access",
            "isAccessibleForFree": true,
            "featureList": [
              "Convert pasted HTML from documents, web pages, email clients, and editors into Markdown.",
              "Display the converted Markdown as raw text.",
              "Copy converted Markdown to the clipboard.",
              "Clear the current pasted content and Markdown output.",
              "Run conversion locally in the browser without sending pasted content to an application server."
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "creator": {
              "@id": "https://sinanbolel.com/#person"
            },

          },

              "https://linkedin.com/in/sinanbolel",
              "https://github.com/sbolel",

              "https://www.npmjs.com/~sinanbolel",
              "https://stackoverflow.com/users/1526037/sinanbolel"
            ],

            "worksFor": {

              "name": "Aquia Inc."

  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Paste to Markdown</h1>
        <p class="subtitle">Paste rich text, get clean Markdown.</p>
      </header>

      <div class="instructions">
        <p>
          Copy any rich text (from a webpage, document, or editor) and paste it
          below (<kbd>Ctrl+V</kbd> or <kbd>⌘V</kbd>).
        </p>
      </div>

      <div class="panels">
        <div class="panel">
          <div class="panel-header">
            <h2 id="source-label">Pasted Content</h2>
            <button
              id="clear-btn"
              class="btn btn-secondary"
              title="Clear content"
            >
              Clear
            </button>
          </div>
          <div
            id="source"
            class="panel-content source-panel"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            aria-labelledby="source-label"
            spellcheck="false"
            data-placeholder="Paste rich text here..."
          ></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Markdown Output</h2>
            <button id="copy-btn" class="btn btn-primary" title="Copy markdown">
              Copy
            </button>
          </div>
          <textarea
            id="output"
            class="panel-content output-panel"
            readonly
            placeholder="Markdown will appear here..."
            spellcheck="false"
            aria-label="Markdown output"
          ></textarea>
        </div>
      </div>

      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
